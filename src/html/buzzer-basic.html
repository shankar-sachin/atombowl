<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic game | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1626" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/buzzer_rooms.css">
</head>
<body class="role-host">
  <main class="main basic" id="basicMain">
    <div class="basic-bar">
      <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      <span class="muted" id="statusText">Connecting</span>
      <button id="settingsBtn" class="btn small" type="button">Settings</button>
      <span class="bar-spacer"></span>
      <button id="fullscreenBtn" class="btn small icon-only" type="button" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="endBtn" class="btn danger small" type="button">End game</button>
    </div>

    <p id="hostNote" class="error host-note" role="alert"></p>

    <div class="confirm" id="endConfirm" hidden>
      <p>End the game? Scores are kept, and nobody can buzz after this.</p>
      <button id="endCancelBtn" class="btn" type="button">Cancel</button>
      <button id="endConfirmBtn" class="btn danger" type="button">End game</button>
    </div>

    <div class="basic-switches" role="group" aria-label="Show on screen">
      <label class="switch-item"><span>Points</span><button id="swPoints" class="toggle" type="button" role="switch" aria-checked="false"><span class="knob"></span></button></label>
      <label class="switch-item"><span>Teams</span><button id="swTeams" class="toggle" type="button" role="switch" aria-checked="false"><span class="knob"></span></button></label>
      <label class="switch-item"><span>Timer</span><button id="swTimer" class="toggle" type="button" role="switch" aria-checked="false"><span class="knob"></span></button></label>
      <label class="switch-item"><span>Game Clock</span><button id="swClock" class="toggle" type="button" role="switch" aria-checked="false"><span class="knob"></span></button></label>
    </div>

    <section class="basic-code" aria-label="Game code">
      <p class="invite-label">Game code</p>
      <div class="basic-code-row">
        <p class="basic-code-text" id="roomCode">-----</p>
        <button id="copyBtn" class="btn small" type="button"><i data-icon="copy"></i><span id="copyLabel">Copy</span></button>
      </div>
    </section>

    <section class="basic-controls" aria-label="Buzzer controls">
      <button id="clearBtn" class="btn large" type="button">Clear buzzers <kbd class="kbd">S</kbd></button>
      <button id="lockBtn" class="btn large lock-toggle" type="button" role="switch" aria-checked="false">
        <span id="lockLabel">Unlocked</span> <kbd class="kbd">Space</kbd>
      </button>
    </section>
    <div class="buzzer" id="buzzer" hidden>
      <div><strong id="buzzerName"></strong> <span class="muted" id="buzzerTeam"></span></div>
    </div>

    <section class="panel basic-timer" id="timerPanel" hidden aria-label="Timer">
      <h2 class="side-title">Timer</h2>
      <div class="clock-row">
        <button id="timerDisplay" class="numerals timer-display" type="button" title="Click to set the timer">00:30</button>
        <button id="timerStart" class="btn" type="button"><i data-icon="play"></i>Start</button>
        <button id="timerPause" class="btn" type="button"><i data-icon="pause"></i>Pause</button>
        <button id="timerReset" class="btn" type="button"><i data-icon="reset"></i>Reset</button>
      </div>
    </section>

    <section class="panel basic-timer" id="clockPanel" hidden aria-label="Game clock">
      <h2 class="side-title">Game clock</h2>
      <div class="clock-row">
        <button id="gameClock" class="numerals timer-display" type="button" title="Click to set the game clock">--:--</button>
        <button id="clockStart" class="btn" type="button"><i data-icon="play"></i>Start</button>
        <button id="clockPause" class="btn" type="button"><i data-icon="pause"></i>Pause</button>
        <button id="clockReset" class="btn" type="button"><i data-icon="reset"></i>Reset</button>
      </div>
    </section>

    <section class="panel basic-players" aria-label="Players">
      <h2 class="side-title">Players <span class="muted" id="playerCount"></span></h2>
      <div id="playerList"></div>
    </section>

    <div class="basic-over" id="over" hidden>
      <p>Game over.</p>
      <a class="btn primary" href="/buzzer-create">New game</a>
    </div>
  </main>

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <form method="dialog" class="settings-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="btn small" value="close">Done</button>
    </form>
    <div class="settings-body" id="settingsBody"></div>
  </dialog>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script type="module" src="js/buzzer_basic.js"></script>
</body>
</html>
