<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Question bank | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1626" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/question_bank.css">
</head>
<body>
  <main class="main bank">
    <header class="header">
      <div>
        <h1 class="title">Question bank</h1>
        <p class="subtitle">Search every toss-up and bonus. Press Practice on a question to play it in the practice engine.</p>
      </div>
    </header>

    <section class="filters" aria-label="Filter questions">
      <label class="search-field" for="search">
        <span class="visually-hidden">Search questions</span>
        <i data-icon="search"></i>
        <input id="search" type="search" placeholder="Search answers, question text, sets and rounds" autocomplete="off" />
      </label>

      <div class="filter-selects">
        <div class="filter">
          <label class="label" for="bankSelect">Bank</label>
          <select id="bankSelect">
            <option value="ALL">All banks</option>
            <option value="data/set_B.json">Scalazar (Set B)</option>
            <option value="data/set_A.json">Dynamazar (Set A)</option>
          </select>
        </div>

        <div class="filter">
          <label class="label" for="level">Level</label>
          <select id="level">
            <option value="ANY">Any level</option>
            <option value="MS">Middle school</option>
            <option value="HS">High school</option>
          </select>
        </div>

        <div class="filter">
          <label class="label" for="category">Category</label>
          <select id="category">
            <option value="ANY">Any category</option>
            <option value="ASTRONOMY">Astronomy</option>
            <option value="BIOLOGY">Biology</option>
            <option value="CHEMISTRY">Chemistry</option>
            <option value="COMPUTER SCIENCE">Computer science</option>
            <option value="EARTH AND SPACE">Earth and space</option>
            <option value="EARTH AND SPACE SCIENCE">Earth and space science</option>
            <option value="EARTH SCIENCE">Earth science</option>
            <option value="ENERGY">Energy</option>
            <option value="GENERAL SCIENCE">General science</option>
            <option value="LIFE SCIENCE">Life science</option>
            <option value="MATH">Math</option>
            <option value="MATHEMATICS">Mathematics</option>
            <option value="PHYSICAL SCIENCE">Physical science</option>
            <option value="PHYSICS">Physics</option>
          </select>
        </div>

        <div class="filter">
          <label class="label" for="bonus">Type</label>
          <select id="bonus">
            <option value="ANY">Any type</option>
            <option value="false">Toss-ups</option>
            <option value="true">Bonuses</option>
          </select>
        </div>
      </div>
    </section>

    <div class="results-bar">
      <p class="result-count"><span id="count" class="numerals">0</span> <span id="countLabel">questions</span></p>
      <p id="status" class="status muted" aria-live="polite"></p>
    </div>

    <p id="err" class="error bank-error hidden" role="alert"></p>

    <div id="grid" class="results"></div>

    <nav class="pager" aria-label="Pages">
      <button class="btn" id="prev" type="button"><i data-icon="chevronLeft"></i>Previous</button>
      <span class="pager-label">Page <span id="page">1</span> of <span id="pages">1</span></span>
      <button class="btn" id="next" type="button">Next<i data-icon="chevronRight"></i></button>
    </nav>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/question_bank.js"></script>
</body>
</html>
