<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Practice | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1626" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/practice_home.css">
</head>
<body>
  <main class="main setup">
    <header class="header">
      <div>
        <h1 class="title">Practice</h1>
        <p class="subtitle">Set your filters and topics, then pick a mode to start a run.</p>
      </div>
      <div class="bank-status" aria-live="polite">
        <div class="bank-status-head">
          <span>Question bank</span>
          <span class="tag" id="bankStatus">Checking</span>
        </div>
        <p class="status-note" id="bankMeta">data/set_B.json</p>
      </div>
    </header>

    <div class="setup-layout">
      <div class="setup-main">
        <section class="block" aria-labelledby="filtersTitle">
          <div class="block-head">
            <h2 id="filtersTitle">Filters</h2>
            <p class="muted">These apply to every mode.</p>
          </div>

          <div class="controls">
            <div class="field">
              <label class="label" for="bankSelect">Question bank</label>
              <select id="bankSelect">
                <option value="data/set_A.json">Dynamazar (Set A)</option>
                <option value="data/set_B.json" selected>Scalazar (Set B)</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="level">Division</label>
              <select id="level">
                <option value="ANY">Any</option>
                <option value="MS">Middle school</option>
                <option value="HS">High school</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="qaType">Question type</label>
              <select id="qaType">
                <option value="ANY">Short answer and multiple choice</option>
                <option value="SA">Short answer</option>
                <option value="MC">Multiple choice</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="bonus">Toss-up or bonus</label>
              <select id="bonus">
                <option value="ANY">Both</option>
                <option value="false">Toss-ups only</option>
                <option value="true">Bonuses only</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="count">Questions per run</label>
              <input id="count" type="number" min="5" max="100" step="5" value="25" />
            </div>

            <div class="field">
              <label class="label" for="seconds">Seconds to buzz on toss-ups</label>
              <input id="seconds" type="number" min="5" max="30" step="1" value="10" />
            </div>

            <label class="check-field field-wide" for="noTimerCheck">
              <input type="checkbox" id="noTimerCheck" checked>
              <span>
                <strong>No buzz timer</strong>
                <span class="muted">Take as long as you need before buzzing. You still get 5 seconds to answer.</span>
              </span>
            </label>

            <div class="field">
              <label class="label" for="setName">Set name (optional)</label>
              <input id="setName" type="text" placeholder="For example Sample-Set-1" />
            </div>

            <div class="field">
              <label class="label" for="roundName">Round name (optional)</label>
              <input id="roundName" type="text" placeholder="For example round10" />
            </div>
          </div>
        </section>

        <section class="block" aria-labelledby="topicsTitle">
          <div class="block-head topic-panel-header">
            <div>
              <h2 id="topicsTitle">Topics</h2>
              <p class="muted">Leave everything unchecked to include all topics.</p>
            </div>
            <div class="button-row">
              <button class="btn small" type="button" id="toggleAdvanced" aria-expanded="false" aria-controls="topicGrid">Show subtopics</button>
              <button class="btn small quiet" type="button" id="clearTopics">Clear topics</button>
            </div>
          </div>
          <div class="topic-grid" id="topicGrid" aria-live="polite"></div>
        </section>
      </div>

      <aside class="modes" aria-labelledby="modesTitle">
        <h2 id="modesTitle" class="section-title">Start a run</h2>
        <div class="mode-list" id="modeList">
          <button class="mode" type="button" data-mode="rapid">
            <i data-icon="practice"></i>
            <span class="mode-body">
              <strong>Rapid fire</strong>
              <span>Toss-up and bonus pairs, one after another.</span>
            </span>
            <span class="mode-count" id="countRapid">Loading</span>
          </button>

          <button class="mode" type="button" data-mode="tossups">
            <i data-icon="target"></i>
            <span class="mode-body">
              <strong>Toss-ups only</strong>
              <span>Train buzzer speed and accuracy.</span>
            </span>
            <span class="mode-count" id="countToss">Loading</span>
          </button>

          <button class="mode" type="button" data-mode="bonuses">
            <i data-icon="layers"></i>
            <span class="mode-body">
              <strong>Bonuses only</strong>
              <span>Longer questions with multi-step thinking.</span>
            </span>
            <span class="mode-count" id="countBonus">Loading</span>
          </button>

          <button class="mode" type="button" data-mode="wxyz">
            <i data-icon="type"></i>
            <span class="mode-body">
              <strong>Multiple choice sprint</strong>
              <span>Buzz, then press W, X, Y or Z.</span>
            </span>
            <span class="mode-count" id="countMC">Loading</span>
          </button>

          <button class="mode" type="button" data-mode="sa">
            <i data-icon="pen"></i>
            <span class="mode-body">
              <strong>Short answer drill</strong>
              <span>Buzz, type your answer and press Enter.</span>
            </span>
            <span class="mode-count" id="countSA">Loading</span>
          </button>

          <button class="mode" type="button" data-mode="set">
            <i data-icon="package"></i>
            <span class="mode-body">
              <strong>Run a set</strong>
              <span>Uses the set and round names in Filters.</span>
            </span>
            <span class="mode-count" id="countSet">Loading</span>
          </button>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/practice_home.js"></script>
</body>
</html>
