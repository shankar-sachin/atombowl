<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game clock | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=/game-clock" />
  <meta name="theme-color" content="#0e1626" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <!-- Applies the saved theme, text size and contrast before the first paint. Keep in step with applySettings in common.ts. -->
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('atom_settings_v1')||'{}'),r=document.documentElement;var light=s.theme==='light'||(s.theme!=='dark'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);if(light)r.classList.add('theme-light');var size={s:'15px',m:'16px',l:'18px'}[s.fontSize];if(size)r.style.fontSize=size;if(s.highContrast)r.classList.add('high-contrast');if(s.animations===false)r.classList.add('no-anim');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/more_options.css">
</head>
<body>
  <main class="main redirect-page">
    <section class="panel" aria-labelledby="redirectTitle">
      <h1 id="redirectTitle">The game clock has moved</h1>
      <p class="muted">More options now lives on the game clock page.</p>
      <p><a class="btn primary" href="/game-clock"><i data-icon="clock"></i>Open the game clock</a></p>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/more_options.js"></script>
</body>
</html>
