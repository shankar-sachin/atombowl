<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Learn | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Short Science Bowl lessons by subject, with the key terms that come up in matches." />
  <meta name="theme-color" content="#0e1626" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/learn.css">
</head>
<body>
  <main class="main learn">
    <!-- Lesson browser -->
    <section id="browserView" aria-labelledby="learnTitle">
      <header class="header">
        <div>
          <h1 id="learnTitle" class="title">Learn</h1>
          <p class="subtitle">Short lessons by subject, with the key terms that come up in matches. Progress is saved on this device, and to your account when you're signed in.</p>
        </div>
      </header>

      <div class="progress-block">
        <div class="progress-head">
          <span id="progressText">Loading progress</span>
          <span id="progressPct" class="muted"></span>
        </div>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Lessons completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="subject-tabs tab-row" id="subjectTabs" role="group" aria-label="Filter by subject"></div>

      <div class="lesson-grid" id="lessonGrid" aria-live="polite">
        <p class="state-msg">Loading lessons…</p>
      </div>
    </section>

    <!-- Lesson reader -->
    <section id="readerView" class="hidden" aria-labelledby="readerTitle">
      <button class="btn quiet back-btn" id="backBtn" type="button"><i data-icon="arrowLeft"></i>All lessons</button>

      <article class="reader">
        <header class="reader-header">
          <p class="reader-subject" id="readerSubject"></p>
          <h1 class="reader-title" id="readerTitle" tabindex="-1"></h1>
          <div class="section-meter">
            <span id="sectionProgress">Section 1 of 1</span>
            <span class="section-steps" id="sectionSteps" aria-hidden="true"></span>
          </div>
        </header>

        <div class="lesson-content" id="lessonContent" aria-live="polite"></div>

        <div class="key-term-tooltip hidden" id="keyTermTooltip" role="tooltip"></div>

        <nav class="section-nav" aria-label="Lesson sections">
          <button class="btn" id="prevSectionBtn" type="button"><i data-icon="chevronLeft"></i>Previous</button>
          <button class="btn primary" id="nextSectionBtn" type="button">Next<i data-icon="chevronRight"></i></button>
        </nav>

        <div class="complete-section">
          <button class="btn good" id="completeBtn" type="button"><i data-icon="check"></i><span id="completeLabel">Mark complete</span></button>
          <p class="complete-status hidden" id="completeStatus"><i data-icon="check"></i>You've completed this lesson.</p>
        </div>
      </article>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script type="module" src="js/learn.js"></script>
</body>
</html>
